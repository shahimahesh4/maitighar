<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" fill="none" class="w-full h-full">
  <defs>
    <!-- Kraft paper gradients -->
    <linearGradient id="kraftTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6B3"/>
      <stop offset="50%" stop-color="#E2C29A"/>
      <stop offset="100%" stop-color="#D4AE80"/>
    </linearGradient>
    <linearGradient id="kraftLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59E70"/>
      <stop offset="100%" stop-color="#A57D50"/>
    </linearGradient>
    <linearGradient id="kraftRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9B487"/>
      <stop offset="100%" stop-color="#B88F60"/>
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="boxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="20" stdDeviation="16" flood-color="#003D2A" flood-opacity="0.45"/>
    </filter>
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#002D1E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="270" cy="285" rx="150" ry="55" fill="#003D2A" opacity="0.4" filter="blur(20px)"/>

  <!-- ==================== BOX 1 (BOTTOM) ==================== -->
  <g transform="translate(140, 160)" filter="url(#boxShadow)">
    <!-- Right side face -->
    <polygon points="120,40 185,78 185,108 120,70" fill="url(#kraftRight)"/>
    <!-- Left side face -->
    <polygon points="0,70 120,70 120,108 0,108" fill="url(#kraftLeft)"/>
    <!-- Top face -->
    <polygon points="0,70 65,32 185,40 120,78" fill="url(#kraftTop)"/>
  </g>

  <!-- ==================== BOX 2 (MIDDLE) ==================== -->
  <g transform="translate(175, 110)" filter="url(#layerShadow)">
    <!-- Right side face -->
    <polygon points="120,40 185,78 185,110 120,72" fill="url(#kraftRight)"/>
    <!-- Left side face -->
    <polygon points="0,72 120,72 120,110 0,110" fill="url(#kraftLeft)"/>
    <!-- Top face -->
    <polygon points="0,72 65,34 185,42 120,80" fill="url(#kraftTop)"/>
    <!-- Text on left face of middle box -->
    <text x="32" y="96" font-family="'DM Sans', sans-serif" font-size="11" font-weight="900" fill="#1E3A8A" letter-spacing="1" opacity="0.85">FLAT BOX MOCKUP</text>
  </g>

  <!-- ==================== BOX 3 (TOP) ==================== -->
  <g transform="translate(205, 55)" filter="url(#layerShadow)">
    <!-- Right side face (front right flap) -->
    <polygon points="125,42 195,82 195,116 125,76" fill="url(#kraftRight)"/>
    <!-- Left side face (front left flap) -->
    <polygon points="0,76 125,76 125,116 0,116" fill="url(#kraftLeft)"/>
    <!-- Top face -->
    <polygon points="0,76 70,36 195,42 125,82" fill="url(#kraftTop)"/>

    <!-- Left flap text -->
    <text x="25" y="101" font-family="'DM Sans', sans-serif" font-size="11" font-weight="900" fill="#1E3A8A" letter-spacing="1.2" opacity="0.9">FLAT BOX MOCKUP</text>

    <!-- Top face text (skewed & rotated to match isometric top perspective) -->
    <g transform="translate(42, 60) skewX(-40) rotate(12)">
      <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="20" font-weight="900" fill="#1E3A8A" letter-spacing="0.5" opacity="0.92">Flat</text>
      <text x="0" y="18" font-family="'DM Sans', sans-serif" font-size="20" font-weight="900" fill="#1E3A8A" letter-spacing="0.5" opacity="0.92">Box</text>
      <text x="0" y="36" font-family="'DM Sans', sans-serif" font-size="20" font-weight="900" fill="#1E3A8A" letter-spacing="0.5" opacity="0.92">Mockup</text>
      <text x="0" y="49" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="700" fill="#1E3A8A" letter-spacing="1" opacity="0.75">FLAT. CLEAN. READY TO SHINE.</text>
    </g>
  </g>
</svg>
